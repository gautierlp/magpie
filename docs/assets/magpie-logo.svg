    <path d="M446 160 L452 172 L464 176 L452 180 L446 192 L440 180 L428 176 L440 172 Z" fill="#000" stroke-width="3"/>
    <path d="M470 150 L478 142 M474 196 L482 204 M446 140 L446 128" fill="none" stroke-width="5"/>
  </g>
  <!-- ink spots -->
  <g fill="#000">
    <circle cx="140" cy="120" r="3"/><circle cx="160" cy="98" r="2"/><circle cx="420" cy="440" r="3"/>
    <circle cx="448" cy="428" r="2"/><circle cx="210" cy="180" r="2"/><circle cx="96" cy="300" r="2.5"/>
    <circle cx="390" cy="96" r="2"/><circle cx="470" cy="300" r="2.5"/>
  </g>
</svg>
